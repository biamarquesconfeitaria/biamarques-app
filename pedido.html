<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#FEE4E5">
<title>Seu pedido · Bia Marques Confeitaria</title>
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@600;700&family=Allura&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Página do cliente: uma coluna, cartões rosa sobre fundo branco, igual ao app da Bia. */
:root{--bg:#FFFFFF;--pink:#FEE4E5;--soft:#FBD0D7;--line:#F4C9D0;--ink:#3A2431;--muted:#7D6175;--brand:#A2708B;--accent:#8A5674;--good:#4F7A2E;--warn:#B0611A;--zap:#25D366;
  --f-display:"Josefin Sans","Avenir Next",system-ui,sans-serif;--f-script:"Allura","Snell Roundhand",cursive;--f-body:"Figtree",-apple-system,system-ui,"Segoe UI",sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:16px/1.5 var(--f-body);-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
img{max-width:100%}
.topo{background:var(--pink);text-align:center;padding:calc(28px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 26px max(16px,env(safe-area-inset-left,0px))}
.topo img{width:118px;height:118px;border-radius:50%;box-shadow:0 0 0 4px #fff}
.nm{font-family:var(--f-display);font-weight:700;letter-spacing:.12em;color:var(--brand);font-size:1.35rem;margin-top:12px;text-transform:uppercase}
.sc{font-family:var(--f-script);color:var(--brand);font-size:2.6rem;line-height:.9}
.tit{display:inline-block;margin-top:14px;font-family:var(--f-display);font-weight:700;letter-spacing:.14em;font-size:1rem;background:#fff;color:var(--ink);padding:8px 16px;border-radius:999px}
main{max-width:640px;margin:0 auto;padding:22px max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:22px}
.k{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
h2{font-family:var(--f-display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand);font-size:1rem;margin:0 0 10px;padding-bottom:8px;border-bottom:3px solid var(--soft)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.duo b{display:block;font-size:1.08rem}
.muted{color:var(--muted)}
a{color:var(--accent);font-weight:700}
.rows{display:flex;flex-direction:column;gap:12px}
.row{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.row b{font-weight:700}
.row .v{color:var(--accent);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.row small{display:block;color:var(--muted);font-size:.88rem}
.total{background:var(--pink);border-radius:18px;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
.total span{font-weight:700;font-size:1.1rem}
.total b{font-size:2rem;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.pg{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.pg .row span{color:var(--muted)}
.card{background:var(--pink);border-radius:18px;padding:16px}
.pix{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}
.pix canvas{width:150px;height:150px;border-radius:12px;background:#fff}
.pix .val{font-size:1.5rem;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.cod{margin-top:12px;background:#fff;border:2px solid var(--soft);border-radius:12px;padding:10px 12px;font:600 .78rem/1.4 ui-monospace,Menlo,Consolas,monospace;word-break:break-all;user-select:all}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--ink);font:700 1rem var(--f-body);text-decoration:none;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.zap{background:var(--zap);border-color:var(--zap);color:#fff}
.btn:disabled{opacity:.6}
.btn:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stack{display:flex;flex-direction:column;gap:10px}
.aviso{border-radius:16px;padding:14px 16px;background:#EEF6E7;border:1px solid #CFE3BC}
.aviso b{display:block;color:var(--good);font-size:1.05rem}
.aviso.warn{background:#FFF4E8;border-color:#F4D2AC}.aviso.warn b{color:var(--warn)}
form{display:flex;flex-direction:column;gap:12px}
label{font-size:.85rem;font-weight:700;color:var(--muted)}
input[type=text],input[type=tel]{width:100%;font:16px var(--f-body);color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:.95rem;color:var(--ink);font-weight:500}
.chk input{width:22px;height:22px;accent-color:var(--accent);flex-shrink:0;margin-top:1px}
.err{color:#A33A3A;font-weight:600}
ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:8px;color:var(--ink);font-size:.95rem}
.lista{background:var(--pink);border-radius:18px;overflow:hidden}
.lista a{display:flex;align-items:center;gap:14px;padding:14px 16px;text-decoration:none;color:var(--ink);border-top:2px solid #fff}
.lista a:first-child{border-top:0}
.lista .ic{width:44px;height:44px;border-radius:50%;background:var(--accent);display:grid;place-items:center;flex-shrink:0}
.lista .ic.z{background:var(--zap)}
.lista .ic svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.lista b{display:block;font-weight:700}
.lista small{color:var(--accent);font-weight:600;font-size:.9rem}
.lista .go{margin-left:auto;color:var(--accent);font-size:1.6rem;font-weight:700}
.lista a>span:not(.ic):not(.go){min-width:0;flex:1}
.lista b{overflow-wrap:anywhere}
.fim{text-align:center;font-family:var(--f-script);color:var(--brand);font-size:2.3rem;margin-top:6px}
.msg{max-width:440px;margin:80px auto;padding:0 16px;text-align:center;color:var(--muted)}
.msg b{display:block;color:var(--ink);font-size:1.2rem;margin-bottom:6px}
@media(max-width:420px){.pix{grid-template-columns:1fr;justify-items:center;text-align:center}.duo{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="raiz"><p class="msg">Carregando o seu pedido…</p></div>
<script src="config.js"></script>
<script src="vendor/supabase-2.117.3.js"></script>
<script>
(async function(){
  var raiz=document.getElementById('raiz'),token=decodeURIComponent(location.hash.slice(1));
  function $(i){return document.getElementById(i)}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function aviso(t,x){raiz.innerHTML='<div class="msg"><b>'+esc(t)+'</b>'+esc(x)+'</div>'}
  var C=window.BIA_CONFIG||{};
  if(!token||!C.supabaseUrl||!window.supabase){aviso('Link incompleto','Confira se o link foi copiado inteiro ou peça um novo para a Bia.');return}
  // Sem login: o cliente só acessa este pedido, pelas funções bia_ver_pedido e bia_aceitar_pedido.
  var sb=window.supabase.createClient(C.supabaseUrl,C.supabaseKey,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
  var r;try{r=await sb.rpc('bia_ver_pedido',{p_token:token})}catch(e){r={error:e}}
  if(r.error){aviso('Não foi possível abrir o pedido','Confira a internet e tente de novo.');return}
  if(!r.data||!r.data.dados){aviso('Pedido não encontrado','Este link não está mais ativo. Peça um novo para a Bia.');return}
  var D=r.data.dados,aceite=r.data.aceite;
  document.title=(D.titulo||'Pedido')+' · '+(D.emp||'Bia Marques Confeitaria');
  var I={
    insta:'<rect x="4" y="4" width="16" height="16" rx="5"/><circle cx="12" cy="12" r="3.6"/><circle cx="16.8" cy="7.2" r=".6" fill="#fff"/>',
    zap:'<path d="M5 19l1.2-3.6A7.6 7.6 0 1 1 9 18.2z"/><path d="M9.5 9.3c.2 2.4 2.6 4.7 5 5"/>',
    mail:'<rect x="3.5" y="6" width="17" height="12" rx="2"/><path d="M4.5 7.5l7.5 5.5 7.5-5.5"/>',
    site:'<circle cx="12" cy="12" r="8.5"/><ellipse cx="12" cy="12" rx="3.8" ry="8.5"/><path d="M3.5 12h17"/>',
    star:'<path d="M12 4l2.4 5 5.4.6-4 3.7 1.1 5.4L12 16l-4.9 2.7 1.1-5.4-4-3.7 5.4-.6z" fill="#fff"/>'};
  var ic=function(k,z){return '<span class="ic'+(z?' z':'')+'"><svg viewBox="0 0 24 24" aria-hidden="true">'+I[k]+'</svg></span>'};
  var linha=function(i){return '<div class="row"><div><b>'+esc(i.t)+'</b>'+(i.sub?'<small>'+esc(i.sub)+'</small>':'')+'</div>'+(i.v?'<span class="v">'+esc(i.v)+'</span>':'')+'</div>'};
  var ped=D.status==='orcamento';
  var html='';
  html+='<header class="topo"><img src="icons/icon-512.png" alt="Logo Bia Marques Confeitaria"><div class="nm">Bia Marques</div><div class="sc">Confeitaria</div><div class="tit">'+esc(D.titulo||'ORÇAMENTO')+'</div></header><main>';
  html+='<div id="acStatus"></div>';
  html+='<section class="duo"><div><div class="k">Cliente</div><b>'+esc(D.cliente||'—')+'</b></div><div><div class="k">Retirada</div><b>'+esc(D.retirada&&D.retirada.quando||'A combinar')+'</b><div class="muted" style="font-size:.92rem">'+esc(D.retirada&&D.retirada.local||'')+'</div>'+(D.retirada&&D.retirada.maps?'<a href="'+esc(D.retirada.maps)+'" target="_blank" rel="noopener">'+(D.retirada.app?'Endereço no mapa para o motorista ›':'Ver rota no mapa ›')+'</a>':'')+'</div></section>';
  html+='<section><h2>Seu bolo</h2><div class="rows">'+(D.itens||[]).map(linha).join('')+'</div></section>';
  html+='<section><div class="total"><span>Total</span><b>'+esc(D.total)+'</b></div><div class="pg">'+(D.pg||[]).map(function(x){return '<div class="row"><span>'+esc(x[0])+'</span><b>'+esc(x[1])+'</b></div>'}).join('')+'</div></section>';
  if(D.pix||D.cartao){
    html+='<section><h2>Pagamento</h2><div class="stack">';
    if(D.pix)html+='<div class="card"><div class="row"><div style="font-size:1.3rem;font-weight:800">Pix</div><div class="val" style="font-size:1.5rem;font-weight:800;color:var(--accent)">'+esc(D.pix.valor)+'</div></div><div class="muted">'+esc(D.pix.rotulo||'')+'</div><div class="muted" style="font-size:.9rem;margin-top:6px">Copie o código e cole no app do banco em Pix copia e cola.</div><div class="cod" id="cod">'+esc(D.pix.cod)+'</div><button class="btn pri" type="button" id="copiar" style="margin-top:10px">Copiar código Pix</button></div>';
    if(D.cartao)html+='<a class="btn" href="'+esc(D.cartao)+'" target="_blank" rel="noopener">Pagar com cartão (até '+(D.parcelas||12)+'x)</a>';
    html+='</div></section>';
  }
  if(ped&&D.totalN>0)html+='<section id="acBox"><h2>Gostou do orçamento?</h2><div class="stack" id="acBts"><button class="btn pri" type="button" id="acAbrir">Aceitar orçamento</button><p class="muted" style="margin:0;font-size:.9rem;text-align:center">O pedido é confirmado com o pagamento do sinal.</p></div>'
    +'<form id="acForm" hidden novalidate><div><label for="acNome">Seu nome</label><input type="text" id="acNome" autocomplete="name" value="'+esc(D.cliente||'')+'"></div><div><label for="acTel">Seu WhatsApp</label><input type="tel" id="acTel" autocomplete="tel" inputmode="tel" value="'+esc(D.telefone||'')+'"></div>'
    +'<label class="chk"><input type="checkbox" id="acOk"><span>Li o orçamento e as informações importantes e aceito.</span></label><p class="err" id="acErr" hidden></p><button class="btn pri" type="submit" id="acEnviar">Confirmar aceite</button><button class="btn" type="button" id="acVoltar">Voltar</button></form></section>';
  if(D.pdf)html+='<section><h2>Guardar o pedido</h2><div class="duo"><button class="btn" type="button" id="pdfB">Baixar PDF</button><button class="btn pri" type="button" id="pdfE">Enviar PDF</button></div><p class="muted" id="pdfSt" style="margin:8px 0 0;font-size:.9rem" aria-live="polite"></p></section>';
  if(D.infos&&D.infos.length)html+='<section><h2>Informações importantes</h2><ol>'+D.infos.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ol></section>';
  var nb=[];if(D.insta)nb.push('<a href="'+esc(D.insta.url)+'" target="_blank" rel="noopener">'+ic('insta')+'<span><b>Veja mais bolos no Instagram</b><small>'+esc(D.insta.handle)+'</small></span><span class="go">›</span></a>');
  if(D.aval)nb.push('<a href="'+esc(D.aval)+'" target="_blank" rel="noopener">'+ic('star')+'<span><b>Veja nossas avaliações</b><small>O que nossos clientes dizem</small></span><span class="go">›</span></a>');
  if(nb.length)html+='<section><h2>Nossos bolos</h2><div class="lista">'+nb.join('')+'</div></section>';
  var ct=[];if(D.zap)ct.push('<a href="'+esc(D.zap.url)+'" target="_blank" rel="noopener">'+ic('zap',1)+'<span><b>'+esc(D.zap.label)+'</b><small>WhatsApp</small></span><span class="go">›</span></a>');
  if(D.email)ct.push('<a href="mailto:'+esc(D.email)+'">'+ic('mail')+'<span><b>'+esc(D.email)+'</b><small>E-mail</small></span><span class="go">›</span></a>');
  if(D.site)ct.push('<a href="'+esc(D.site.url)+'" target="_blank" rel="noopener">'+ic('site')+'<span><b>'+esc(D.site.label)+'</b><small>Site</small></span><span class="go">›</span></a>');
  if(ct.length)html+='<section><h2>Contato</h2><div class="lista">'+ct.join('')+'</div></section>';
  if(D.horario)html+='<p class="muted" style="text-align:center;margin:0;font-size:.92rem">'+esc(D.horario)+'</p>';
  html+='<div class="fim">Obrigada pela preferência!</div></main>';
  raiz.innerHTML=html;

  function copiar(t,bt,okTxt){function ok(){var o=bt.textContent;bt.textContent=okTxt;setTimeout(function(){bt.textContent=o},2500)}
    function fb(){var ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok()}catch(e){}ta.remove()}
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,fb);else fb()}
  if($('copiar'))$('copiar').onclick=function(){copiar(D.pix.cod,this,'Código copiado! Cole no app do banco.')};

  // Aceite
  function fmt(iso){var d=new Date(iso);return d.toLocaleDateString('pt-BR')+' às '+String(d.getHours()).padStart(2,'0')+'h'+String(d.getMinutes()).padStart(2,'0')}
  function mostrarAceite(a,agora){
    if($('acBox'))$('acBox').hidden=true;
    var msg=['*ORÇAMENTO ACEITO*','Cliente: '+a.nome,'WhatsApp: '+(a.whats||'não informado'),'Bolo: '+(D.resumo||''),'Retirada: '+(D.retirada&&D.retirada.quando||''),'Valor: '+D.total,D.pix?(D.pix.rotulo+': '+D.pix.valor):'','','Segue o comprovante do sinal:'].filter(function(x,i,l){return x!==''||l[i-1]!==''}).join('\n');
    $('acStatus').innerHTML='<div class="aviso"><b>'+(agora?'Orçamento aceito!':'Orçamento aceito em '+esc(fmt(a.data)))+'</b><span>'+(ped?'Para confirmar o pedido, pague o sinal pelo Pix ou cartão e mande o comprovante para a Bia.':'Obrigada! Qualquer dúvida, chame a Bia no WhatsApp.')+'</span>'
      +(D.zap&&ped?'<a class="btn zap" style="margin-top:10px" href="https://wa.me/'+esc(D.zap.num)+'?text='+encodeURIComponent(msg)+'" target="_blank" rel="noopener">Enviar comprovante pelo WhatsApp</a>':'')+'</div>';
    if(agora)$('acStatus').scrollIntoView({behavior:'smooth',block:'start'});
  }
  if(aceite)mostrarAceite(aceite,false);
  if($('acAbrir')){
    $('acAbrir').onclick=function(){$('acBts').hidden=true;$('acForm').hidden=false;$('acNome').focus()};
    $('acVoltar').onclick=function(){$('acForm').hidden=true;$('acBts').hidden=false};
    $('acForm').addEventListener('submit',async function(e){e.preventDefault();var nome=$('acNome').value.trim(),tel=$('acTel').value.trim(),err=$('acErr');
      if(!nome||!$('acOk').checked){err.textContent='Preencha seu nome e marque que leu e aceita.';err.hidden=false;return}
      err.hidden=true;var bt=$('acEnviar');bt.disabled=true;bt.textContent='Enviando…';
      var res;try{res=await sb.rpc('bia_aceitar_pedido',{p_token:token,p_nome:nome,p_whats:tel})}catch(x){res={error:x}}
      if(res.error||!res.data){bt.disabled=false;bt.textContent='Confirmar aceite';err.textContent='Não foi possível registrar o aceite. Confira a internet e tente de novo.';err.hidden=false;return}
      mostrarAceite(res.data,true)});
  }

  // PDF: o mesmo da Bia, guardado junto com o link
  if(D.pdf){
    var pronto=null;function pegar(){if(!pronto)pronto=fetch(D.pdf).then(function(r){if(!r.ok)throw 0;return r.blob()}).then(function(b){return new File([b],D.pdfNome||'pedido-bia-marques.pdf',{type:'application/pdf'})});pronto.catch(function(){pronto=null});return pronto}
    setTimeout(function(){pegar().catch(function(){})},1200);
    function st(t){$('pdfSt').textContent=t}
    function baixar(f){var u=URL.createObjectURL(f),a=document.createElement('a');a.href=u;a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000)}
    $('pdfB').onclick=async function(){try{baixar(await pegar());st('PDF baixado.')}catch(e){st('Não foi possível baixar o PDF. Tente de novo.')}};
    $('pdfE').onclick=async function(){var f;try{f=await pegar()}catch(e){st('Não foi possível preparar o PDF. Tente de novo.');return}
      if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:f.name});return}catch(e){if(e&&e.name==='AbortError')return;if(e&&e.name==='NotAllowedError'){st('PDF pronto. Toque de novo em “Enviar PDF”.');return}}}
      baixar(f);st('Este aparelho não envia arquivo direto: o PDF foi baixado para você anexar.')};
  }
})();
</script>
</body>
</html>
