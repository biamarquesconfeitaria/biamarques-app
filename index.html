<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bia Marques Confeitaria</title>
<meta name="description" content="Pedidos, cardápio, receitas e ingredientes da Bia Marques Confeitaria.">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bia Marques">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@600;700&family=Allura&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body.acesso .tabs,body.acesso .fab{display:none!important}
.acesso-box{max-width:420px;margin:0 auto;padding-block:40px 24px;display:flex;flex-direction:column;gap:18px}
.acesso-box .brand{justify-content:center;flex-direction:column;text-align:center}
.acesso-box .brand img{width:110px;height:110px}
/* Layout: app de uma coluna para celular, barra de abas fixa embaixo, formulários em "gaveta" que sobe da base */
:root{
  --bg:#FFFFFF; --surface:#FEE4E5; --ink:#3A2431; --muted:#7D6175; --line:#F4C9D0;
  --accent:#8A5674; --accent-ink:#FFFFFF; --soft:#FBD0D7; --brand:#A2708B; --field:#FFFFFF;
  --good:#4F7A2E; --warn:#B0611A; --bad:#A33A3A;
  --shadow:0 1px 2px rgba(60,20,35,.06),0 6px 20px rgba(60,20,35,.06);
  --f-display:"Josefin Sans","Avenir Next",system-ui,sans-serif; --f-script:"Allura","Snell Roundhand",cursive;
  --f-body:"Figtree",-apple-system,system-ui,"Segoe UI",sans-serif;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
:root{color-scheme:light}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.7rem;font-weight:700;line-height:1.1;text-transform:uppercase;letter-spacing:.04em;padding-top:.15em}
.brand{display:flex;align-items:center;gap:14px}
.brand img{width:68px;height:68px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 3px var(--soft)}
.brand .nm{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:1.15rem;color:var(--brand);line-height:1}
.brand .sc{font-family:var(--f-script);font-size:2.3rem;color:var(--brand);line-height:.9;margin-top:2px}
h2{font-size:1.15rem;font-weight:600}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.wrapflex{flex-wrap:wrap}
header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-block:8px 16px}
.section{display:flex;flex-direction:column;gap:10px;margin-top:22px}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.stat b{display:block;font-family:var(--f-body);font-size:1.15rem;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{font-size:.75rem;color:var(--muted);display:block;line-height:1.25}
@media (max-width:370px){.stats{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:1/-1}}

.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.item{display:flex;gap:12px;align-items:center;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:left;width:100%;cursor:pointer}
.item:last-child{border-bottom:0}
.item:active{background:var(--soft)}
.item .main{flex:1;min-width:0}
.item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:.85rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .end{text-align:right;flex-shrink:0}
.item .end b{display:block;font-variant-numeric:tabular-nums}
.daybadge{width:46px;flex-shrink:0;text-align:center;border-radius:12px;background:var(--soft);padding:6px 0;line-height:1.05}
.daybadge b{display:block;font-family:var(--f-display);font-size:1.3rem;font-weight:700;padding-top:2px}
.daybadge small{font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.daybadge.late{background:var(--bad);color:var(--surface)}
.daybadge.late small{color:inherit}
.dayhead{font-size:.8rem;font-weight:700;color:var(--muted);padding:2px 4px;text-transform:capitalize}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:700;padding:3px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-orc{color:var(--muted)} .s-conf{color:var(--accent)} .s-prod{color:var(--warn)} .s-pronto{color:var(--good)} .s-ok{color:var(--muted);border-style:dashed} .s-canc{color:var(--bad);text-decoration:line-through}
.tag{font-size:.68rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--warn);border:1px dashed var(--warn);border-radius:6px;padding:1px 5px;margin-left:6px;vertical-align:2px}
.owe{color:var(--warn);font-size:.8rem;font-weight:600}
.paid{color:var(--good);font-size:.8rem;font-weight:600}

.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters button{flex-shrink:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:.88rem;font-weight:600;padding:7px 13px;border-radius:999px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:700;cursor:pointer;text-decoration:none;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;border-color:transparent;color:var(--accent);padding:0 8px}
.btn.danger{color:var(--bad);border-color:var(--line);background:none}
.btn.danger.armed{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.btn.block{width:100%}
.btn:focus-visible,.item:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.tabs a:focus-visible,.filters button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:5;border-radius:999px;box-shadow:0 6px 18px rgba(110,50,85,.28);padding:0 20px}

.empty{border:1.5px dashed var(--line);border-radius:16px;padding:22px 18px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:1.02rem;margin-bottom:4px}
.note{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:.88rem}
.note.warn{border:1px solid var(--warn)}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs nav{display:grid;grid-template-columns:repeat(6,1fr);max-width:640px;margin:0 auto}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;color:var(--muted);text-decoration:none;font-size:.68rem;font-weight:600}
.tabs a svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs a[aria-current="page"]{color:var(--accent)}

/* gaveta */
.scrim{position:fixed;inset:0;background:rgba(20,8,14,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:94%;overflow-y:auto;border-radius:22px 22px 0 0;padding-block:8px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheethead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;position:sticky;top:-8px;background:var(--bg);padding-block:6px;z-index:1}
form.f{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lbl{font-size:.82rem;font-weight:700;color:var(--muted)}
.field small{font-size:.78rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-width:0}
textarea{min-height:84px;resize:vertical}
input[type=date],input[type=time]{min-height:46px;-webkit-appearance:none;appearance:none}
.calc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.calc .r{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums;font-size:.92rem}
.calc .r.total{border-top:1px solid var(--line);padding-top:8px;font-weight:700}
.calc .big{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-top:1px solid var(--line);padding-top:10px}
.calc .big b{font-family:var(--f-body);font-size:1.6rem;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.ingrow{display:grid;grid-template-columns:minmax(0,1fr) 84px 36px;gap:6px;align-items:center}
.ingrow .x{border:0;background:none;color:var(--muted);font-size:1.4rem;cursor:pointer;height:44px}
.ingrow .u{font-size:.75rem;color:var(--muted);grid-column:1/-1;margin-top:-4px;padding-left:4px}
.actions{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:30;max-width:90%;text-align:center}
.search{margin-bottom:2px}
.price-big{font-family:var(--f-body);font-weight:700;color:var(--accent);font-size:1.15rem}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1px solid var(--line);background:var(--field);border-radius:999px;padding:9px 13px;font:inherit;font-size:.9rem;font-weight:600;color:var(--ink);cursor:pointer;min-height:40px}
.pill[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pill.add{border-style:dashed;border-color:var(--brand);color:var(--accent);background:none}
.pill small{font-weight:500;opacity:.85}
.pill:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sub{font-family:var(--f-display);font-size:.95rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--brand);border-top:1px solid var(--line);padding-top:14px;margin-top:2px}
.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;padding:0;text-align:left;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;min-width:0}
.mcard .ph{aspect-ratio:4/5;background:var(--soft);display:flex;align-items:center;justify-content:center;width:100%;max-width:100%;overflow:hidden}
.mcard .ph img{width:100%;height:100%;object-fit:cover;display:block}
.mcard .ph svg{width:44%;height:auto;stroke:var(--brand);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.mcard .bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.mcard .nm{font-weight:700;line-height:1.25}
.mcard .pr{color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
.mcard .ct{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.mcard:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.gal{display:flex;gap:10px;overflow-x:auto;padding:8px 2px 4px}
.gal .th img{width:96px;height:120px}
.gal .capa{position:absolute;left:6px;bottom:6px;background:var(--ink);color:var(--bg);font-size:.62rem;font-weight:700;padding:2px 6px;border-radius:6px;text-transform:uppercase;letter-spacing:.05em}
.addph{width:96px;height:120px;border:1.5px dashed var(--brand);border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--accent);font-weight:700;font-size:.82rem;flex-shrink:0;cursor:pointer;padding:6px}
.gear{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--line);color:var(--accent);flex-shrink:0}
.gear svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.gear:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip2{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.88rem;font-weight:600}
ol.infos{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px;font-size:.92rem}
details summary{list-style-position:inside}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.drop{border:1.5px dashed var(--brand);border-radius:16px;padding:16px;background:var(--surface);display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.drop.over{background:var(--soft);border-style:solid}
.drop-t{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);font-size:1rem}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.th{position:relative}
.th img{width:64px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block}
.th button{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-size:1rem;line-height:1;cursor:pointer}
.bar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;width:35%;background:var(--accent);border-radius:3px;animation:slide 1.4s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
@media (prefers-reduced-motion:reduce){.bar i{animation:none;width:100%;opacity:.5}}
.sigbox{position:relative;background:#fff;border:1.5px dashed var(--brand);border-radius:14px;overflow:hidden;touch-action:none}
.sigbox canvas{display:block;width:100%;height:auto;touch-action:none;cursor:crosshair}
.sigbox img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;pointer-events:none}
.agnav{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}
.agnav b{font-size:1.1rem}
.agnav .btn{min-width:44px;font-size:1.4rem}
.agcal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px}
.agw,.agg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.agw span{text-align:center;font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;padding:4px 0}
.agd{min-height:58px;border:1px solid transparent;border-radius:10px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;padding:5px 2px;cursor:pointer;position:relative;color:var(--ink);font:inherit}
.agd .dn{font-weight:700;font-size:.92rem}
.agd .dq{font-size:.62rem;font-weight:700;line-height:1.1;padding:2px 4px;border-radius:6px;background:var(--soft);color:var(--accent)}
.agd.cheio .dq{background:var(--warn);color:#fff}
.agd.tem{background:var(--pink)}
.agd.cheio{background:#FBE3D3}
.agd.pass{opacity:.55}
.agd.hj{border-color:var(--accent)}
.agd.sel{outline:3px solid var(--accent);outline-offset:-1px}
.agd .dorc{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;border:1.5px solid var(--accent)}
.lg{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px}
.lg.tem{background:var(--pink);border:1px solid var(--line)}.lg.cheio{background:var(--warn)}.lg.orc{border:1.5px solid var(--accent);border-radius:50%}
.ggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding-bottom:90px}
.gcell{position:relative;aspect-ratio:1;border:0;padding:0;border-radius:10px;overflow:hidden;background:var(--soft);cursor:pointer}
.gcell img{width:100%;height:100%;object-fit:cover;display:block}
.gcell.on{outline:4px solid var(--accent);outline-offset:-4px}
.gcell.on img{opacity:.8}
.gnum{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;font-size:.85rem;display:flex;align-items:center;justify-content:center}
.gbar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:5;display:grid;grid-template-columns:1fr 2fr;gap:10px;padding:10px 16px;background:var(--surface);border-top:1px solid var(--line);max-width:640px;margin:0 auto}
.revrow{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.revrow.off{opacity:.55}
.revrow.off .field,.revrow.off .grid3{display:none}
input[type=checkbox]{width:22px;height:22px;padding:0;flex-shrink:0;accent-color:var(--accent);margin-top:2px}
.cmp{font-size:.86rem;font-weight:600}
.up{color:var(--warn)} .down{color:var(--good)}
.vbadge{font-size:.72rem;font-weight:800;margin-left:6px;vertical-align:1px;font-variant-numeric:tabular-nums}
.item.static{cursor:default}
.item .s.wl{white-space:normal}
a.note{display:block;color:var(--ink);text-decoration:none}
</style>
</head>
<body>

<div class="wrap" id="app">
  <div id="view"><p class="muted" style="padding-top:40px">Carregando…</p></div>
</div>

<div class="tabs"><nav id="tabs">
  <a href="#inicio" data-t="inicio"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>Início</a>
  <a href="#pedidos" data-t="pedidos"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Pedidos</a>
  <a href="#agenda" data-t="agenda"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M8 14h2M12 14h2M16 14h0M8 17h2M12 17h2"/></svg>Agenda</a>

async function carregarTudo(){
  const out=[];
  for(let de=0;;de+=1000){
    const {data,error}=await sb.from(T_DOCS).select('col,id,data').order('col').order('id').range(de,de+999);
    if(error)throw error;out.push(...data);if(data.length<1000)return out;
  }
}
// Imita o banco do Claude (collection/doc/onSnapshot) para o resto do app não mudar.
function nuvemDb(linhas){
  let cache={};const subs={};
  const put=r=>{(cache[r.col]=cache[r.col]||{})[r.id]=r.data};
  const tira=(c,id)=>{if(cache[c])delete cache[c][id]};
  const meta={fromCache:false,hasPendingWrites:false};
  const fire=c=>(subs[c]||[]).forEach(f=>f());
  const ouvir=(c,f)=>{(subs[c]=subs[c]||[]).push(f);f()};
  const ok=({error})=>{if(error)throw error};
  const ref=(c,id)=>({
    id,
    async set(data){ok(await sb.from(T_DOCS).upsert({col:c,id,data}));put({col:c,id,data});fire(c)},
    async update(data){const d={...((cache[c]||{})[id]||{}),...data};ok(await sb.from(T_DOCS).upsert({col:c,id,data:d}));put({col:c,id,data:d});fire(c)},
    async delete(){ok(await sb.from(T_DOCS).delete().eq('col',c).eq('id',id));tira(c,id);fire(c)},
    onSnapshot(next){ouvir(c,()=>{const d=(cache[c]||{})[id];next({id,exists:!!d,data:()=>d,metadata:meta})});return()=>{}}
  });
  const trocarTudo=ls=>{cache={};ls.forEach(put);Object.keys(subs).forEach(fire)};
  linhas.forEach(put);
  sb.channel('bia_docs').on('postgres_changes',{event:'*',schema:'public',table:T_DOCS},p=>{
    if(p.eventType==='DELETE'){const o=p.old||{};if(o.col){tira(o.col,o.id);fire(o.col)}}
    else if(p.new&&p.new.col){const antes=(cache[p.new.col]||{})[p.new.id];const ac=p.new.data&&p.new.data.aceite;put(p.new);fire(p.new.col);
      if(p.new.col==='pedidos'&&ac&&!(antes&&antes.aceite))setTimeout(()=>toast(`${ac.nome} aceitou o orçamento!`),60)}
  }).subscribe();
  document.addEventListener('visibilitychange',async()=>{if(document.visibilityState!=='visible')return;try{trocarTudo(await carregarTudo())}catch(e){}});
  return{
    collection:c=>({
      doc:id=>ref(c,id||uid()),
      async add(data){const r=ref(c,uid());await r.set(data);return r},
      onSnapshot(next){ouvir(c,()=>{const docs=Object.entries(cache[c]||{}).map(([id,d])=>({id,exists:true,data:()=>d,metadata:meta}));next({docs,size:docs.length,empty:!docs.length,metadata:meta})});return()=>{}}
    }),
    doc:path=>{const [c,id]=path.split('/');return ref(c,id)},
    async importar(mapas){
      const ls=[];Object.entries(mapas).forEach(([c,m])=>Object.entries(m||{}).forEach(([id,data])=>{if(data&&typeof data==='object')ls.push({col:c,id:String(id),data})}));
      for(let i=0;i<ls.length;i+=200)ok(await sb.from(T_DOCS).upsert(ls.slice(i,i+200)));
      trocarTudo([...Object.entries(cache).flatMap(([c,m])=>Object.entries(m).filter(([id])=>!ls.some(r=>r.col===c&&r.id===id)).map(([id,data])=>({col:c,id,data}))),...ls]);
    }
  };
}

function subscribe(){
  let pending=Object.keys(COLS).length+1;
  const timer=setTimeout(()=>{if(pending>0){S.note='Ainda não consegui carregar seus dados. Confira a internet; o app continua tentando.';render()}},10000);
  const done=()=>{pending--;if(pending<=0){clearTimeout(timer);S.note='';S.loaded=true}};
  Object.entries(COLS).forEach(([k,col])=>{
    let first=true;
    S.db.collection(col).onSnapshot(snap=>{
      const m={};snap.docs.forEach(d=>{m[d.id]=d.data()});S[k]=m;
      if(first&&!snap.metadata.fromCache){first=false;done()}
      render();
    },err=>{if(first){first=false;done()}S.note='Erro ao carregar '+col+': '+(err&&err.message||'tente abrir de novo');render()});
  });
  let firstC=true;
  S.db.doc('config/geral').onSnapshot(snap=>{
    S.cfg={...DEFAULT_CFG,...(snap.exists?snap.data():{})};
    if(firstC&&!snap.metadata.fromCache){firstC=false;done()}
    render();
  },()=>{if(firstC){firstC=false;done()}});
}
async function save(k,id,obj){
  id=id||uid();
  S[k]={...S[k],[id]:obj};render();
  if(S.db){try{await S.db.collection(COLS[k]).doc(id).set(obj)}catch(e){toast('Não salvou: '+(e&&e.message||'erro'))}}
  else saveLocal();
  return id;
}
async function remove(k,id){
  const m={...S[k]};delete m[id];S[k]=m;render();
  if(S.db){try{await S.db.collection(COLS[k]).doc(id).delete()}catch(e){toast('Não excluiu: '+(e&&e.message||'erro'))}}
  else saveLocal();
}
async function saveCfg(obj){
  S.cfg={...S.cfg,...obj};render();
  if(S.db){try{await S.db.doc('config/geral').set({...S.cfg})}catch(e){toast('Não salvou: '+(e&&e.message||'erro'))}}
  else saveLocal();
}

/* ---------- cálculos ---------- */
function custoReceita(r,IM){IM=IM||S.ing;
  let ing=0;const falt=[];
  (r.itens||[]).forEach(it=>{const g=IM[it.ingId];if(!g||!num(g.qtd)){if(num(it.qtd))falt.push(it);return}ing+=num(g.preco)/num(g.qtd)*num(it.qtd)});
  const ind=ing*num(S.cfg.indiretosPct)/100;
  const mo=num(r.horas)*num(S.cfg.valorHora);
  const emb=num(r.embalagem);
  const total=ing+ind+mo+emb;
  const margem=(r.margem!==undefined&&r.margem!==''&&r.margem!==null)?num(r.margem):num(S.cfg.margemPct);
  const preco=total*(1+margem/100);
  const kg=num(r.rendimentoKg);
  return{ing,ind,mo,emb,total,margem,preco,lucro:preco-total,porKg:kg?preco/kg:0,custoKg:kg?total/kg:0,falt};
}
function sugestaoPedido(p){
  const r=S.rec[p.receitaId];if(!r)return null;
  const c=custoReceita(r);const kg=num(p.pesoKg);if(!kg||!c.porKg)return null;
  return c.porKg*kg+num(p.extras);
}

/* ---------- gaveta ---------- */
function sheetRoot(layer){const id=layer===1?'sheetRoot':'sheetRoot'+layer;let r=document.getElementById(id);if(!r){r=document.createElement('div');r.id=id;document.body.appendChild(r)}return r}
function openSheet(title,body,layer=1){
  const root=sheetRoot(layer);
  root.innerHTML=`<div class="scrim" style="z-index:${18+layer*2}"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="grab"></div><div class="sheethead"><h2>${esc(title)}</h2><button class="btn ghost" data-act="fechar" data-layer="${layer}" type="button">Fechar</button></div>${body}</div></div>`;
  document.body.style.overflow='hidden';
  root.querySelector('.scrim').addEventListener('click',e=>{if(e.target===e.currentTarget)closeSheet(layer)});
  return root.querySelector('.sheet');
}
function closeSheet(layer=1){sheetRoot(layer).innerHTML='';if(!document.querySelector('.scrim'))document.body.style.overflow=''}
function armDelete(btn,fn){
  if(btn.classList.contains('armed')){fn();return}
  btn.classList.add('armed');const o=btn.textContent;btn.textContent='Toque de novo para excluir';
  setTimeout(()=>{if(btn.isConnected){btn.classList.remove('armed');btn.textContent=o}},3500);
}

/* ingrediente */
function formIng(id,catNovo){
  const g=id?S.ing[id]:{nome:'',preco:'',qtd:catNovo==='embalagem'?1:'',unidade:catNovo==='embalagem'?'un':'g',cat:catNovo||'ingrediente'};
  const emb=isEmb(g),pal=emb?'embalagem':'ingrediente';
  const sh=openSheet(id?`Editar ${pal}`:(emb?'Nova embalagem':'Novo ingrediente'),`<form class="f" id="fIng">
    <div class="field"><label for="iNome">Nome</label><input id="iNome" name="nome" required value="${esc(g.nome)}" placeholder="${emb?'Ex.: Caixa com visor 21x21':'Ex.: Leite condensado'}"></div>
    <div class="field"><label for="iCat">Tipo</label><select id="iCat" name="cat"><option value="ingrediente" ${emb?'':'selected'}>Ingrediente (vai na receita)</option><option value="embalagem" ${emb?'selected':''}>Embalagem (caixa, base, fita…)</option></select></div>
    <div class="grid3">
      <div class="field"><label for="iPreco">Preço pago</label><input id="iPreco" name="preco" inputmode="decimal" required value="${inVal(g.preco)}" placeholder="7,50"></div>
      <div class="field"><label for="iQtd">${emb?'Vem quantas':'Embalagem'}</label><input id="iQtd" name="qtd" inputmode="decimal" required value="${inVal(g.qtd)}" placeholder="${emb?'1':'395'}"></div>
      <div class="field"><label for="iUn">Unidade</label><select id="iUn" name="unidade">${Object.keys(UN).map(u=>`<option value="${u}" ${g.unidade===u?'selected':''}>${u}</option>`).join('')}</select></div>
    </div>
    <div class="note" id="iCalc"></div>
    ${(g.historico||[]).length?`<div class="field"><span class="lbl">Últimos preços</span><div class="list">${g.historico.slice(-5).reverse().map(h=>`<div class="item static"><div class="main"><div class="t num">${brl(h.preco)} <span class="muted" style="font-weight:400">por ${fmt(h.qtd)} ${esc(h.unidade||g.unidade)}</span></div><div class="s">${h.data?fmtData(h.data):'Preço anterior'}${h.loja?' · '+esc(h.loja):''}</div></div></div>`).join('')}</div></div>`:''}
    <div class="actions"><button class="btn primary" type="submit">Salvar</button>${id?`<button class="btn danger" type="button" id="iDel">Excluir ${pal}</button>`:''}</div>
  </form>`);
  const f=sh.querySelector('form');
  const upd=()=>{const p=num(f.preco.value),q=num(f.qtd.value),u=f.unidade.value;sh.querySelector('#iCalc').textContent=q?`Sai a ${brl(p/q)} por ${u}${u!=='un'?` (${brl(p/q*1000)} por ${u==='g'?'kg':'litro'})`:''}.`:'Coloque o tamanho da embalagem, por exemplo 395 g ou 1000 ml.'};
  f.addEventListener('input',upd);upd();
  f.addEventListener('submit',e=>{e.preventDefault();
    const prev=id?S.ing[id]:null;const hoje=isoD(new Date());
    const novo={...(prev||{}),nome:f.nome.value.trim(),preco:num(f.preco.value),qtd:num(f.qtd.value),unidade:f.unidade.value,cat:f.cat.value};delete novo.exemplo;if(prev&&prev.exemplo&&!(num(prev.preco)!==num(f.preco.value)||num(prev.qtd)!==num(f.qtd.value)))novo.exemplo=true;
    const mudou=!prev||prev.exemplo||num(prev.preco)!==novo.preco||num(prev.qtd)!==novo.qtd||(prev.unidade||'g')!==novo.unidade;
    const hist=prev?histBase(prev):[];
    if(mudou)hist.push({data:hoje,preco:novo.preco,qtd:novo.qtd,unidade:novo.unidade,loja:null});
    novo.historico=hist.slice(-12);novo.atualizado=mudou?hoje:(prev.atualizado||null);
    save('ing',id,novo);closeSheet();toast(novo.cat==='embalagem'?'Embalagem salva':'Ingrediente salvo')});
  const del=sh.querySelector('#iDel');if(del)del.addEventListener('click',()=>{
    const usado=Object.values(S.rec).some(r=>(r.itens||[]).some(it=>it.ingId===id));
    const usadoTam=Object.values(S.comp).some(c=>(c.embItens||[]).some(it=>it.ingId===id));
    if((usado||usadoTam)&&!del.classList.contains('armed'))toast(usadoTam?'Atenção: esta embalagem está em um tamanho de bolo.':'Atenção: este ingrediente é usado em receitas.');
    armDelete(del,()=>{remove('ing',id);closeSheet();toast(emb?'Embalagem excluída':'Ingrediente excluído')})});
  f.cat.addEventListener('change',()=>{if(f.cat.value==='embalagem'&&f.unidade.value!=='un'){f.unidade.value='un';if(!num(f.qtd.value)||num(f.qtd.value)>=50)f.qtd.value='1';upd()}});
}

/* receita */
function formRec(id){
  const r=id?S.rec[id]:{nome:'',rendimentoKg:'',itens:[],embalagem:'',horas:'',margem:''};
  const draft={itens:(r.itens||[]).map(x=>({...x}))};
  if(!draft.itens.length)draft.itens.push({ingId:'',qtd:''});
  const ings=Object.entries(S.ing).filter(([iid,g])=>!isEmb(g)||draft.itens.some(x=>x.ingId===iid)).sort((a,b)=>(a[1].nome||'').localeCompare(b[1].nome||''));
  const opts=sel=>`<option value="">Escolha…</option>`+ings.map(([iid,g])=>`<option value="${esc(iid)}" ${iid===sel?'selected':''}>${esc(g.nome)}</option>`).join('');
  const sh=openSheet(id?'Editar receita':'Nova receita',`<form class="f" id="fRec">
    <div class="field"><label for="rNome">Nome do bolo</label><input id="rNome" name="nome" required value="${esc(r.nome)}" placeholder="Ex.: Massa branca com brigadeiro"></div>
    <div class="grid2">
      <div class="field"><label for="rKg">Rende quantos kg?</label><input id="rKg" name="rendimentoKg" inputmode="decimal" required value="${inVal(r.rendimentoKg)}" placeholder="2"></div>
      <div class="field"><label for="rHoras">Horas de trabalho</label><input id="rHoras" name="horas" inputmode="decimal" value="${inVal(r.horas)}" placeholder="4"></div>
      <div class="field"><label for="rEmb">Embalagem e base</label><input id="rEmb" name="embalagem" inputmode="decimal" value="${inVal(r.embalagem)}" placeholder="12,00"><small>caixa, base, fita (R$)</small></div>
      <div class="field"><label for="rMargem">Lucro (%)</label><input id="rMargem" name="margem" inputmode="decimal" value="${inVal(r.margem)}" placeholder="${inVal(S.cfg.margemPct)} (padrão)"></div>
    </div>
    <div class="field"><span class="lbl">Ingredientes usados</span>
      ${ings.length?'':'<div class="note warn">Você ainda não cadastrou ingredientes. Salve a receita e cadastre-os na aba Ingredientes.</div>'}
      <div class="stack" id="rItens" style="gap:8px"></div>
      <button class="btn" type="button" id="rAdd">+ Adicionar ingrediente</button></div>
    <div class="calc" id="rCalc"></div>
    <div class="actions"><button class="btn primary" type="submit">Salvar receita</button>${id?'<button class="btn danger" type="button" id="rDel">Excluir receita</button>':''}</div>
  </form>`);
  const f=sh.querySelector('form');const box=sh.querySelector('#rItens');
  const drawItens=()=>{box.innerHTML=draft.itens.map((it,i)=>{const g=S.ing[it.ingId];const u=g?(UN[g.unidade]||'g'):'';const c=g&&num(g.qtd)?num(g.preco)/num(g.qtd)*num(it.qtd):0;return`<div class="ingrow" data-i="${i}"><select aria-label="Ingrediente" data-k="ingId">${opts(it.ingId)}</select><input aria-label="Quantidade" data-k="qtd" inputmode="decimal" value="${inVal(it.qtd)}" placeholder="qtd"><button class="x" type="button" data-rm="${i}" aria-label="Remover">×</button>${g?`<div class="u">${fmt(num(it.qtd))} ${u} · ${brl(c)}</div>`:''}</div>`}).join('')};
  const recalc=()=>{const tmp={rendimentoKg:f.rendimentoKg.value,horas:f.horas.value,embalagem:f.embalagem.value,margem:f.margem.value,itens:draft.itens};const c=custoReceita(tmp);

/* partes do bolo */
const TIPOS={tamanho:{t:'Tamanho',pl:'Tamanhos',add:'Adicionar tamanho',ex:'Ex.: Bolo P'},massa:{t:'Massa',pl:'Massas',add:'Adicionar massa',ex:'Ex.: Massa branca'},recheio:{t:'Recheio',pl:'Recheios',add:'Adicionar recheio',ex:'Ex.: Brigadeiro'},cobertura:{t:'Cobertura',pl:'Coberturas',add:'Adicionar cobertura',ex:'Ex.: Chantilly'},topper:{t:'Topper',pl:'Toppers',add:'Adicionar topper',ex:'Ex.: Topper 3D'}};
const compsDe=tipo=>Object.entries(S.comp).filter(([,c])=>c.tipo===tipo).map(([id,c])=>({id,...c})).sort(tipo==='tamanho'?((a,b)=>(a.consultar?1:0)-(b.consultar?1:0)||num(a.preco)-num(b.preco)):tipo==='topper'?((a,b)=>num(a.preco)-num(b.preco)):tipo==='recheio'?((a,b)=>(a.especial?1:0)-(b.especial?1:0)||(a.nome||'').localeCompare(b.nome||'')):((a,b)=>(a.nome||'').localeCompare(b.nome||'')));
const precoTam=t=>t.consultar?'Consultar valor':brl(t.preco);
function custoLote(c,IM){IM=IM||S.ing;let t=0;(c.itens||[]).forEach(it=>{const g=IM[it.ingId];if(g&&num(g.qtd))t+=num(g.preco)/num(g.qtd)*num(it.qtd)});return t}
function custoKgComp(c,IM){if(!c)return 0;if(c.modo==='manual')return num(c.custoKg);const kg=num(c.rendeKg);return kg?custoLote(c,IM)/kg:0}
const nomeComp=id=>(S.comp[id]&&S.comp[id].nome)||'';
function resumoBolo(p){const b=p.bolo;if(!b)return'';return[b.tamanho,b.massa,(b.recheios||[]).join(' e '),b.cobertura,b.topper].filter(Boolean).join(' · ')}
function custoEmbTam(t,IM){IM=IM||S.ing;let s=0;(t&&t.embItens||[]).forEach(it=>{const g=IM[it.ingId];if(g&&num(g.qtd))s+=num(g.preco)/num(g.qtd)*(num(it.qtd)||1)});return Math.round(s*100)/100}
const temEmbTam=t=>!!(t&&(t.embItens||[]).some(it=>S.ing[it.ingId]));
const embPadrao=t=>temEmbTam(t)?custoEmbTam(t):num(S.cfg.embalagemPadrao);
function calcPedido(d){
  const tam=S.comp[d.tamanhoId];
  const m=S.comp[d.massaId],cob=S.comp[d.coberturaId];
  const recs=(d.recheioIds||[]).map(id=>S.comp[id]).filter(Boolean);
  const consultar=!!(tam&&tam.consultar);
  const base=tam?(consultar?num(d.valorBolo):num(tam.preco)):0;
  const temEsp=recs.some(c=>c.especial);
  const adic=temEsp?num(d.adicEspecial):0;
  const top=d.topper&&S.comp[d.topperId]?num(S.comp[d.topperId].preco):0;
  const deco=num(d.extras);
  const total=Math.round((base+adic+top+deco)*100)/100;
  const peso=tam?num(tam.pesoKg):0;
  const cm=custoKgComp(m)*peso,cr=recs.length?recs.reduce((t,c)=>t+custoKgComp(c),0)/recs.length*peso:0,cc=custoKgComp(cob)*peso;
  const ing=cm+cr+cc,ind=ing*num(S.cfg.indiretosPct)/100;
  const horas=(d.horas===''||d.horas==null)?peso*num(S.cfg.horasKg):num(d.horas);
  const mo=horas*num(S.cfg.valorHora);
  const emb=(d.embalagem===''||d.embalagem==null)?embPadrao(tam):num(d.embalagem);
  const custo=ing+ind+emb;
  const semCusto=[m,...recs,cob].filter(c=>c&&!custoKgComp(c)).map(c=>c.nome);
  return{tam,consultar,base,temEsp,adic,top,deco,total,ok:!!tam&&base>0,peso,cm,cr,cc,ing,ind,horas,mo,emb,custo,semCusto,nRec:recs.length};
}

function parseFaixa(t){const m=String(t||'').match(/(\d{1,2})(?:[:h](\d{2}))?\D+(\d{1,2})(?:[:h](\d{2}))?/);if(!m)return null;return[`${pad(+m[1])}:${m[2]||'00'}`,`${pad(+m[3])}:${m[4]||'00'}`]}
function avisosPedido(d){

  if(d.entrega&&ATIVO(d.status)){
    const min=d.topper?num(S.cfg.prazoTopo):num(S.cfg.prazoSem);const k=dayDiff(d.entrega);
    if(k>=0&&k<min)out.push(`Prazo curto: pedidos ${d.topper?'com':'sem'} topo de bolo pedem ${fmt(min)} dias de antecedência.`);

  if(d.entrega&&ATIVO(d.status)){const outros=Object.entries(S.ped).filter(([pid,x])=>x.entrega===d.entrega&&x.status!=='cancelado'&&x.status!=='orcamento'&&x!==d&&pid!==d._id).length;if(outros>=capDia())out.push(`Agenda cheia nesse dia: já tem ${outros} bolo${outros>1?'s':''} (limite ${capDia()}).`)}
  if(d.hora&&d.entrega){const dt=parseD(d.entrega);if(dt){const dom=dt.getDay()===0;const fx=parseFaixa(dom?S.cfg.horarioDom:S.cfg.horarioSem);if(fx&&(d.hora<fx[0]||d.hora>fx[1]))out.push(`Fora do horário de retirada (${dom?'domingo':'segunda a sábado'}: ${dom?S.cfg.horarioDom:S.cfg.horarioSem}).`)}}

function msgPedido(p,extra){
  const c=S.cfg;const d=parseD(p.entrega);
  const quando=d?`${WDL[d.getDay()]}, ${pad(d.getDate())}/${pad(d.getMonth()+1)}${p.hora?' às '+p.hora.replace(':','h'):''}`:'a combinar';
  const primeiro=(p.cliente||'').split(' ')[0];const oi=`Olá${primeiro?', '+primeiro:''}!`;
  const orc=p.status==='orcamento';
  const L=[];
  if(orc)L.push(`${oi} Segue o orçamento do seu bolo:`,'');
  else if(p.status==='pronto')L.push(`${oi} Seu bolo está pronto para retirada.`,'');
  else L.push(`${oi} Seu pedido está confirmado. Confira os detalhes:`,'');
  const b=p.bolo||{};
  if(b.tamanho)L.push(`Tamanho: ${b.tamanho}${b.fatias?` (rende ${fmt(b.fatias)} fatias)`:''}`);
  else if(p.pesoKg)L.push(`Peso: ${fmt(p.pesoKg)} kg`);
  if(b.massa)L.push(`Massa: ${b.massa}`);
  if(b.recheios&&b.recheios.length)L.push(`Recheio: ${b.recheios.join(' e ')}`);
  if(b.cobertura)L.push(`Cobertura: ${b.cobertura}`);
  if(b.topper)L.push(`Topo de bolo: ${b.topper}`);
  if(b.decoracoes&&b.decoracoes.length)L.push(`Decoração: ${b.decoracoes.join(', ')}`);
  if(p.descricao)L.push(`Detalhes: ${p.descricao}`);
  L.push('',`Retirada: ${quando}`);
  if(p.retirada==='app')L.push(`Motorista de aplicativo: o pedido do carro e o transporte ficam por sua conta. Endereço para o motorista: ${c.endereco}`);
  else if(c.endereco)L.push(`Local: ${c.endereco}`);
  L.push('');
  if(p.valor)L.push(`Valor total: ${brl(p.valor)}`);
  if(orc&&p.valor){
    L.push(`O pedido é confirmado com o pagamento de ${fmt(c.sinalPct)}% do valor (${brl(p.valor*num(c.sinalPct)/100)}).`);
  }else if(p.valor){
    if(p.sinal)L.push(`Sinal recebido: ${brl(p.sinal)}`);
    const s=saldo(p);L.push(s?`Falta pagar: ${brl(s)}`:'Pagamento completo. Obrigada!');
  }
  if(orc&&c.pagamento)L.push(`Formas de pagamento: ${c.pagamento}`);
  if(orc&&(c.horarioSem||c.horarioDom))L.push('',`Horário de retirada: segunda a sábado ${c.horarioSem}${c.horarioDom?` e domingo ${c.horarioDom}`:''}. É preciso retirar no horário combinado.`);
  if(extra&&extra.length)L.push('',...extra);
  L.push('',c.nome||'');
  return L.join('\n').replace(/\n{3,}/g,'\n\n').trim();
}
/* ---------- Pix ---------- */
function tipoChave(k){k=String(k||'').trim();if(!k)return'celular';if(/@/.test(k))return'email';if(/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(k))return'aleatoria';const d=k.replace(/\D/g,'');if(d.length===14)return'cnpj';if(d.length===11&&/^\d{2}9/.test(d))return'celular';if(d.length===11)return'cpf';return'celular'}
function pixChave(){const c=S.cfg;let k=String(c.pix||'').trim();if(!k)return'';const t=c.pixTipo||tipoChave(k);
  if(t==='celular'){const d=k.replace(/\D/g,'');k=(d.startsWith('55')&&d.length>=12)?'+'+d:'+55'+d}
  else if(t==='cpf'||t==='cnpj')k=k.replace(/\D/g,'');
  else if(t==='email')k=k.toLowerCase();
  return k}
const semAcento=t=>String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9 ]/g,'').replace(/\s+/g,' ').trim();
const tlv=(id,v)=>id+String(v.length).padStart(2,'0')+v;
function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
function pixCodigo(valor,ref){
  const k=pixChave();if(!k)return'';
  const nome=semAcento(S.cfg.pixNome||S.cfg.nome).toUpperCase().slice(0,25)||'RECEBEDOR';
  const cid=semAcento(S.cfg.pixCidade||'Brasil').toUpperCase().slice(0,15)||'BRASIL';
  const tx=(semAcento(ref).replace(/ /g,'').toUpperCase()||'***').slice(0,25);
  let s=tlv('00','01')+tlv('26',tlv('00','br.gov.bcb.pix')+tlv('01',k))+tlv('52','0000')+tlv('53','986')+(valor>0?tlv('54',(Math.round(valor*100)/100).toFixed(2)):'')+tlv('58','BR')+tlv('59',nome)+tlv('60',cid)+tlv('62',tlv('05',tx));
  s+='6304';return s+crc16(s);
}
function drawQR(ctx,text,x,y,size,cor){
  if(!window.qrcode||!text)return false;
  try{const q=window.qrcode(0,'M');q.addData(text);q.make();const n=q.getModuleCount(),m=n+8,cell=size/m;
    ctx.fillStyle='#FFFFFF';ctx.fillRect(x,y,size,size);ctx.fillStyle=cor||'#2B1A22';
    for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))ctx.fillRect(Math.floor(x+(c+4)*cell),Math.floor(y+(r+4)*cell),Math.ceil(cell),Math.ceil(cell));

let sigTem=false;
function ligarAssinatura(){
  const cv=document.getElementById('sigPad');if(!cv||cv.dataset.on)return;cv.dataset.on='1';sigTem=false;
  const x=cv.getContext('2d');x.lineWidth=5;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#2B1B25';
  let des=false,ult=null;
  const pt=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height}};
  cv.addEventListener('pointerdown',e=>{const im=document.getElementById('sigAtual');if(im)im.remove();des=true;ult=pt(e);cv.setPointerCapture(e.pointerId);x.beginPath();x.arc(ult.x,ult.y,2.5,0,Math.PI*2);x.fillStyle='#2B1B25';x.fill();sigTem=true;e.preventDefault()});
  cv.addEventListener('pointermove',e=>{if(!des)return;const p=pt(e);x.beginPath();x.moveTo(ult.x,ult.y);x.lineTo(p.x,p.y);x.stroke();ult=p;e.preventDefault()});
  const fim=()=>{des=false};cv.addEventListener('pointerup',fim);cv.addEventListener('pointercancel',fim);
}
function limparAssinatura(){const cv=document.getElementById('sigPad');if(!cv)return;cv.getContext('2d').clearRect(0,0,cv.width,cv.height);const im=document.getElementById('sigAtual');if(im)im.remove();sigTem=false}
function salvarAssinatura(){
  const cv=document.getElementById('sigPad');if(!cv)return;
  if(!sigTem){toast(S.cfg.assinatura?'Para trocar, toque em “Assinar de novo” e assine no quadro.':'Assine no quadro com o dedo.');return}
  // recorta só a parte assinada
  const x=cv.getContext('2d'),d=x.getImageData(0,0,cv.width,cv.height).data;let x0=cv.width,y0=cv.height,x1=0,y1=0;
  for(let y=0;y<cv.height;y++)for(let i=0;i<cv.width;i++)if(d[(y*cv.width+i)*4+3]>10){if(i<x0)x0=i;if(i>x1)x1=i;if(y<y0)y0=y;if(y>y1)y1=y}
  if(x1<=x0){toast('Assine no quadro com o dedo.');return}
  const m=12;x0=Math.max(0,x0-m);y0=Math.max(0,y0-m);x1=Math.min(cv.width,x1+m);y1=Math.min(cv.height,y1+m);
  const o=document.createElement('canvas');o.width=x1-x0;o.height=y1-y0;o.getContext('2d').drawImage(cv,x0,y0,o.width,o.height,0,0,o.width,o.height);

function dadosPost(p){

function itensGaleria(){
  const m=new Map(),ocultas=new Set();
  Object.entries(S.gal||{}).forEach(([gid,g])=>{if(!g||!g.foto)return;if(g.oculta){ocultas.add(g.foto);return}m.set(g.foto,{foto:g.foto,titulo:g.titulo||'',categoria:g.categoria||'',data:g.criado||'',galId:gid})});
  Object.entries(S.card).forEach(([cid,c])=>(c.fotos||[]).forEach(f=>{const x=m.get(f);if(x){x.cardId=cid;x.titulo=x.titulo||c.nome||'';x.categoria=x.categoria||c.categoria||''}else m.set(f,{foto:f,titulo:c.nome||'',categoria:c.categoria||'',data:c.criado||'',cardId:cid})}));
  Object.entries(S.ped).forEach(([pid,p])=>(Array.isArray(p.fotos)?p.fotos:[]).forEach(f=>{if(typeof f!=='string')return;const t=dadosPost(p).tema||String(p.descricao||'').split('\n')[0].slice(0,40);const x=m.get(f);
    if(x){x.pedId=pid;x.titulo=x.titulo||t;x.data=x.data||p.entrega||''}else m.set(f,{foto:f,titulo:t,categoria:'',data:p.entrega||p.criado||'',pedId:pid})}));
  return[...m.values()].filter(x=>!ocultas.has(x.foto)).sort((a,b)=>String(b.data).localeCompare(String(a.data)));
}

    const emb=(c.itens||[]).length&&(c.itens||[]).every(i=>i.cat==='embalagem');out.push({src:'compra',id,tipo:'s',valor:Math.round(v*100)/100,data:c.data||'',desc:`Nota de compra${c.loja?' · '+c.loja:''}`,cat:emb?'embalagens':'ingredientes',forma:''})});

const ehSaida=m=>m.tipo==='s'||m.tipo==='r';
function vFinanceiro(){
  const t=today();if(!fin.ano){fin.ano=t.getFullYear();fin.mes=t.getMonth()}
  const mesIso=`${fin.ano}-${pad(fin.mes+1)}`;
  const ms=movimentos().filter(m=>m.data.startsWith(mesIso));
  const ent=ms.filter(m=>m.tipo==='e').reduce((s,m)=>s+m.valor,0),des=ms.filter(m=>m.tipo==='s').reduce((s,m)=>s+m.valor,0),ret=ms.filter(m=>m.tipo==='r').reduce((s,m)=>s+m.valor,0);
  const saldoM=ent-des-ret;
  const porCat={};ms.filter(ehSaida).forEach(m=>{porCat[m.cat]=(porCat[m.cat]||0)+m.valor});const cats=Object.entries(porCat).sort((a,b)=>b[1]-a[1]);const maxC=cats.length?cats[0][1]:1;
  const vis=ms.filter(m=>fin.filtro==='tudo'||(fin.filtro==='e'?m.tipo==='e':ehSaida(m)));
  const grupos={};vis.forEach(m=>{(grupos[m.data]=grupos[m.data]||[]).push(m)});
  const receber=Object.values(S.ped).filter(p=>ATIVO(p.status)&&p.status!=='orcamento').reduce((s,p)=>s+saldo(p),0);
  return`<header class="top"><div><div class="eyebrow">Entradas e saídas</div><h1>Financeiro</h1></div></header>
  <div class="agnav"><button class="btn ghost" data-finmes="-1" aria-label="Mês anterior">‹</button><b>${MES[fin.mes].charAt(0).toUpperCase()+MES[fin.mes].slice(1)} ${fin.ano}</b><button class="btn ghost" data-finmes="1" aria-label="Próximo mês">›</button></div>
  <div class="stats"><div class="stat"><b class="down">${brl(ent)}</b><span>entrou</span></div><div class="stat"><b class="up">${brl(des)}</b><span>despesas</span></div><div class="stat"><b class="${saldoM<0?'up':''}">${brl(saldoM)}</b><span>sobrou no mês</span></div></div>
  <div class="row between muted" style="font-size:.88rem;margin:8px 0 12px;flex-wrap:wrap;gap:6px"><span>Retiradas (pró-labore): <b>${brl(ret)}</b></span><span>A receber dos pedidos: <b>${brl(receber)}</b></span></div>
  <div class="grid3" style="margin-bottom:14px"><button class="btn" data-fin="e">+ Entrada</button><button class="btn primary" data-fin="s">+ Despesa</button><button class="btn" data-fin="r">Retirada</button></div>
  ${cats.length?`<div class="section" style="margin-top:0"><h2>Para onde foi o dinheiro</h2><div class="stack" style="gap:8px">${cats.map(([k,v])=>`<div><div class="row between" style="font-size:.88rem"><span>${esc(FIN_CATS[k]?.[0]||'Outras')}</span><b>${brl(v)}</b></div><div class="bar" style="margin-top:3px"><i style="animation:none;width:${Math.max(3,Math.round(v/maxC*100))}%"></i></div></div>`).join('')}</div></div>`:''}
  <div class="section"><div class="row between" style="flex-wrap:wrap;gap:8px"><h2 style="margin:0">Movimentos</h2><button class="btn ghost" data-act="finCsv" style="min-height:32px">Planilha</button></div>
    <div class="filters" style="margin:10px 0">${[['tudo','Tudo'],['e','Entradas'],['s','Saídas']].map(([k,n])=>`<button data-finfil="${k}" aria-pressed="${fin.filtro===k}">${n}</button>`).join('')}</div>
    ${vis.length?Object.entries(grupos).map(([d,arr])=>`<div class="dayhead">${d?esc(diaFin(d)):'Sem data'}</div><div class="list">${arr.map(m=>`<button class="item" data-mov="${m.src}:${esc(m.id)}"><div class="main"><div class="t">${esc(m.desc)}${m.fotos&&m.fotos.length?' 📎':''}</div><div class="s">${esc(FIN_CATS[m.cat]?.[0]||'')}${m.forma?' · '+esc(FORMAS_FIN[m.forma]||FORMAS_PG[m.forma]||m.forma):''}${m.src==='ped'?' · pedido':m.src==='compra'?' · nota lida':m.src==='das'?' · Impostos':''}</div></div><div class="end"><b class="${m.tipo==='e'?'down':'up'}">${m.tipo==='e'?'+':'−'} ${brl(m.valor)}</b></div></button>`).join('')}</div>`).join('')
      :'<div class="empty"><strong>Nada neste mês</strong>Os pagamentos registrados nos pedidos entram aqui sozinhos. Lance as despesas com “+ Despesa”.</div>'}
  </div>`;
}
function formLanc(id,tipo0){
  const l=id?S.lan[id]:{tipo:tipo0||'s',valor:'',data:isoD(new Date()),desc:'',cat:tipo0==='e'?'outras_e':tipo0==='r'?'prolabore':'',forma:'pix',fotos:[]};
  let tipo=l.tipo,forma=l.forma||'pix',fotos=(l.fotos||[]).slice(),enviando=0;
  const catsDe=t=>Object.entries(FIN_CATS).filter(([,v])=>t==='r'?v[1]==='r':v[1]===t);
  const sh=openSheet(id?'Lançamento':'Novo lançamento',`<form class="f">
    <div class="pills" data-ltipo>${[['e','Entrada'],['s','Despesa'],['r','Retirada (pró-labore)']].map(([k,n])=>`<button type="button" class="pill" data-t="${k}" aria-pressed="${k===tipo}">${n}</button>`).join('')}</div>
    <div class="grid2"><div class="field"><label for="lVal">Valor (R$)</label><input id="lVal" name="valor" inputmode="decimal" required value="${inVal(l.valor)}" placeholder="0,00"></div>
      <div class="field"><label for="lData">Data</label><input id="lData" name="data" type="date" required value="${esc(l.data||isoD(new Date()))}"></div></div>
    <div class="field"><label for="lDesc">Descrição</label><input id="lDesc" name="desc" value="${esc(l.desc||'')}" placeholder="Ex.: Mercado, conta de luz, gás…"></div>
    <div class="field" data-catbox><label for="lCat">Categoria</label><select id="lCat" name="cat"></select></div>
    <div class="field"><span class="lbl">Como pagou</span><div class="pills" data-lforma>${Object.entries(FORMAS_FIN).map(([k,n])=>`<button type="button" class="pill" data-f="${k}" aria-pressed="${k===forma}">${n}</button>`).join('')}</div></div>
    ${id?(l.parcela?`<small class="muted">Parcela ${esc(l.parcela)} de uma compra no cartão.</small>`:''):`<div class="field" data-parc hidden><label for="lParc">Parcelas no cartão</label><input id="lParc" name="parcelas" inputmode="numeric" value="1"><small>Em 3x, o app lança uma parcela em cada mês.</small></div>`}
    <div class="field"><span class="lbl">Comprovante ou nota (foto)</span><div class="gal" data-lfotos></div></div>
    <div class="actions"><button class="btn primary" type="submit">Salvar</button>${id?'<button class="btn danger" type="button" data-del>Excluir lançamento</button>':''}</div>
  </form>`);
  const f=sh.querySelector('form');
  const drawCats=()=>{const cs=catsDe(tipo);f.cat.innerHTML=cs.map(([k,v])=>`<option value="${k}" ${k===l.cat?'selected':''}>${v[0]}</option>`).join('');sh.querySelector('[data-catbox]').hidden=cs.length<2};
  const drawParc=()=>{const p=sh.querySelector('[data-parc]');if(p)p.hidden=!(tipo==='s'&&forma==='credito')};
  const drawFotos=()=>{sh.querySelector('[data-lfotos]').innerHTML=fotos.map((x,i)=>`<div class="th"><a href="${esc(blobUrl(x))}" target="_blank" rel="noopener"><img src="${esc(blobUrl(x))}" alt="Comprovante ${i+1}"></a><button type="button" data-rmlf="${i}" aria-label="Remover">×</button></div>`).join('')
    +(enviando?'<div class="addph">Enviando…</div>':'')+(sb&&fotos.length<4?'<label class="addph" for="lFile">+ Foto</label><input class="vh" id="lFile" type="file" accept="image/*" multiple tabindex="-1">':(sb?'':'<small class="muted">Para guardar fotos, entre com a sua conta.</small>'))};
  drawCats();drawParc();drawFotos();
  sh.querySelector('[data-ltipo]').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(!b)return;tipo=b.dataset.t;sh.querySelectorAll('[data-t]').forEach(x=>x.setAttribute('aria-pressed',x===b));l.cat=tipo==='e'?'outras_e':tipo==='r'?'prolabore':'';drawCats();drawParc()});
  sh.querySelector('[data-lforma]').addEventListener('click',e=>{const b=e.target.closest('[data-f]');if(!b)return;forma=b.dataset.f;sh.querySelectorAll('[data-f]').forEach(x=>x.setAttribute('aria-pressed',x===b));drawParc()});
  sh.addEventListener('change',async e=>{if(e.target.id!=='lFile')return;const fs=Array.from(e.target.files||[]);e.target.value='';const a=await getAssets();if(!a)return;
    for(const file of fs){if(fotos.length>=4)break;enviando++;drawFotos();try{const b=await prepImg(file,1800,.85);const r=await a.upload(b);fotos.push(r.id)}catch(er){toast('Não consegui enviar a foto.')}enviando--;drawFotos()}});
  sh.addEventListener('click',e=>{const r=e.target.closest('[data-rmlf]');if(r){fotos.splice(+r.dataset.rmlf,1);drawFotos()}});
  f.addEventListener('submit',async e=>{e.preventDefault();if(enviando){toast('Espere a foto terminar de enviar.');return}
    const v=Math.round(num(f.valor.value)*100)/100;if(!(v>0)){toast('Informe o valor.');return}
    const base={tipo,valor:v,data:f.data.value,desc:f.desc.value.trim(),cat:f.cat.value||(tipo==='r'?'prolabore':tipo==='e'?'outras_e':'outras_s'),forma,fotos,criado:(l.criado||new Date().toISOString())};
    const np=!id&&tipo==='s'&&forma==='credito'?Math.max(1,Math.min(24,Math.round(num(f.parcelas.value))||1)):1;
    if(np>1){const g=uid(),cada=Math.floor(v/np*100)/100;const d0=parseD(base.data);
      for(let i=0;i<np;i++){const d=new Date(d0.getFullYear(),d0.getMonth()+i,Math.min(d0.getDate(),28));await save('lan',null,{...base,valor:i===np-1?Math.round((v-cada*(np-1))*100)/100:cada,data:isoD(d),parcela:`${i+1}/${np}`,grupo:g,fotos:i?[]:fotos})}
      toast(`Lançado em ${np} parcelas`)}
    else{await save('lan',id,{...(id?l:{}),...base});toast('Lançamento salvo')}
    closeSheet()});
  const del=sh.querySelector('[data-del]');if(del)del.addEventListener('click',()=>armDelete(del,async()=>{await remove('lan',id);closeSheet();toast('Lançamento excluído');const a=await getAssets();if(a)(l.fotos||[]).forEach(x=>a.delete(x).catch(()=>{}))}));
}
function abrirMov(key){
  const i=key.indexOf(':'),src=key.slice(0,i),id=key.slice(i+1);
  if(src==='lan')return formLanc(id);
  if(src==='ped')return formPed(id);
  if(src==='das'){location.hash='impostos';return}
  if(src==='compra'){const c=(S.compr||{})[id];if(!c)return;openSheet('Nota de compra',`<div class="stack"><p style="margin:0"><b>${esc(c.loja||'Compra')}</b> · ${c.data?fmtData(c.data):''}${c.total?' · total '+brl(c.total):''}</p><div class="list">${(c.itens||[]).map(x=>`<div class="item static"><div class="main"><div class="t">${esc(x.nome||'')}</div><div class="s">${num(x.pacotes)>1?num(x.pacotes)+' × ':''}${fmt(x.qtd)} ${esc(x.unidade||'')}</div></div><div class="end"><b>${brl(num(x.preco)*(num(x.pacotes)||1))}</b></div></div>`).join('')}</div><small class="muted">Nota lida em Ingredientes → Ler nota de compra.</small></div>`)}
}
function finCsv(){
  const mesIso=`${fin.ano}-${pad(fin.mes+1)}`;const ms=movimentos().filter(m=>m.data.startsWith(mesIso)).sort((a,b)=>a.data.localeCompare(b.data));
  const q=s=>`"${String(s??'').replace(/"/g,'""')}"`;
  const L=[['Data','Tipo','Descrição','Categoria','Forma','Valor'].join(';'),...ms.map(m=>[fmtData(m.data),m.tipo==='e'?'Entrada':m.tipo==='r'?'Retirada':'Despesa',q(m.desc),q(FIN_CATS[m.cat]?.[0]||''),q(FORMAS_FIN[m.forma]||m.forma||''),(m.tipo==='e'?'':'-')+m.valor.toFixed(2).replace('.',',')].join(';'))];
  getDownloads().then(d=>d.save({filename:`financeiro-${mesIso}.csv`,data:new Blob(['﻿'+L.join('\n')],{type:'text/csv'})})).then(()=>toast('Planilha salva'));
}

/* ---------- impostos (MEI) ---------- */
const SAL_MIN={2023:1302,2024:1412,2025:1518,2026:1621};
const MEI_ATIV={com:['Comércio ou indústria (ICMS R$ 1)',0,1],serv:['Serviços (ISS R$ 5)',5,0],ambos:['Comércio e serviços (R$ 6)',5,1]};
const LIMITE_MEI=81000;
const LINKS_FISCAIS=[
  ['Gerar a guia DAS (PGMEI)','Emitir a guia do mês e ver débitos em aberto','https://www8.receita.fazenda.gov.br/SimplesNacional/Aplicacoes/ATSPO/pgmei.app/Identificacao'],
  ['Declaração anual (DASN-SIMEI)','Entregar até 31 de maio','https://www8.receita.fazenda.gov.br/SimplesNacional/Aplicacoes/ATSPO/dasnsimei.app/Identificacao'],
  ['Comprovante do CNPJ (Receita)','Cartão CNPJ e situação cadastral','https://solucoes.receita.fazenda.gov.br/servicos/cnpjreva/cnpjreva_solicitacao.asp'],
  ['e-CAC da Receita','Pendências, mensagens e parcelamentos (entra com a conta gov.br)','https://cav.receita.fazenda.gov.br/autenticacao/login'],
  ['Portal do Simples Nacional','Serviços do MEI e do Simples','https://www8.receita.fazenda.gov.br/SimplesNacional/Servicos/Grupo.aspx?grp=t&area=2'],
  ['Regularize (dívida ativa)','Ver e negociar dívidas na Procuradoria','https://www.regularize.pgfn.gov.br/'],
  ['Conta gov.br','Senha e nível da conta para entrar nos sites','https://www.gov.br/governodigital/pt-br/conta-gov-br']];
const valorDAS=(ano,ativ)=>{const sm=SAL_MIN[ano]||SAL_MIN[Math.max(...Object.keys(SAL_MIN).map(Number))];const a=MEI_ATIV[ativ]||MEI_ATIV.com;return Math.round((sm*0.05+a[1]+a[2])*100)/100};
const venceDAS=comp=>{const y=+comp.slice(0,4),m=+comp.slice(5,7);return new Date(y,m,20)};// dia 20 do mês seguinte
const fmtCnpj=d=>{d=String(d||'').replace(/\D/g,'');return d.length===14?`${d.slice(0,2)}.${d.slice(2,5)}.${d.slice(5,8)}/${d.slice(8,12)}-${d.slice(12)}`:d};
function salvarFiscal(m){saveCfg({fiscal:{...fiscal(),...m}})}
function stDAS(comp){const f=fiscal(),d=(f.das||{})[comp];if(d&&d.st==='pago')return{k:'pago',t:'Paga'};const v=venceDAS(comp),hj=today();const ini=f.inicio||'';if(ini&&comp<ini)return{k:'na',t:'Antes do CNPJ'};if(f.desde&&comp<f.desde)return{k:'na',t:'—'};
  if(new Date(+comp.slice(0,4),+comp.slice(5,7)-1,1)>hj)return{k:'futuro',t:'Ainda não'};if(v<hj)return{k:'vencida',t:'Vencida'};return{k:'aberta',t:'Em aberto'}}
function faturamentoAno(ano){return movimentos().filter(m=>m.tipo==='e'&&m.data.startsWith(String(ano))).reduce((s,m)=>s+m.valor,0)}
function vImpostos(){
  const f=fiscal(),c=f.consulta,hj=today(),ano=hj.getFullYear();
  const fat=faturamentoAno(ano),pct=Math.min(100,fat/LIMITE_MEI*100);
  const comps=[];for(let m=1;m<=12;m++)comps.push(`${ano}-${pad(m)}`);
  const anoAnt=ano-1,fatAnt=faturamentoAno(anoAnt),dasn=(f.dasn||{})[anoAnt];
  const val=valorDAS(ano,f.ativ);
  const atual=comps.filter(k=>['aberta','vencida'].includes(stDAS(k).k));
  return`<header class="top"><div><div class="eyebrow">MEI e Receita Federal</div><h1>Impostos</h1></div></header>
  <div class="section" style="margin-top:0"><h2>Seu CNPJ</h2>
    <div class="row" style="gap:8px"><input id="fxCnpj" inputmode="numeric" placeholder="00.000.000/0001-00" value="${esc(fmtCnpj(f.cnpj||''))}" style="flex:1"><button class="btn primary" data-act="fxConsultar">Consultar</button></div>
    ${c?`<div class="calc" style="margin-top:10px;align-items:stretch;text-align:left">
      <div class="row between" style="gap:8px;align-items:flex-start"><b style="font-size:1.02rem">${esc(c.razao||'')}</b><span class="chip ${/ativa/i.test(c.situacao||'')?'s-conf':'s-canc'}">${esc(c.situacao||'')}</span></div>
      ${c.fantasia?`<span class="muted">${esc(c.fantasia)}</span>`:''}
      <span>CNPJ <b>${esc(fmtCnpj(c.cnpj))}</b> · aberto em ${esc(c.abertura?fmtData(c.abertura):'')}</span>
      <span>${c.mei?'<b style="color:var(--good)">MEI</b>':c.simples?'Simples Nacional':'Não é MEI'}${c.porte?' · '+esc(c.porte):''}</span>
      ${c.cnae?`<span class="muted">Atividade: ${esc(c.cnae)}</span>`:''}
      ${c.endereco?`<span class="muted">${esc(c.endereco)}</span>`:''}
      <small class="muted">Consultado em ${esc(c.em?fmtData(c.em.slice(0,10)):'')}. Débitos não aparecem aqui: veja no PGMEI ou no e-CAC.</small>
      <div class="grid2"><button class="btn" data-act="fxCopiar">Copiar CNPJ</button><a class="btn" href="https://solucoes.receita.fazenda.gov.br/servicos/cnpjreva/cnpjreva_solicitacao.asp" target="_blank" rel="noopener">Cartão CNPJ</a></div>
    </div>`:'<small class="muted">Digite o CNPJ da confeitaria e toque em Consultar para ver a situação cadastral na Receita.</small>'}
  </div>
  <div class="section"><h2>Guia mensal do MEI (DAS ${ano})</h2>
    <div class="grid2"><div class="field"><label for="fxAtiv">Atividade</label><select id="fxAtiv" data-fx="ativ">${Object.entries(MEI_ATIV).map(([k,v])=>`<option value="${k}" ${k===f.ativ?'selected':''}>${v[0]}</option>`).join('')}</select></div>
      <div class="field"><span class="lbl">Valor da guia</span><b style="font-size:1.3rem;padding:8px 0;display:block">${brl(val)}</b></div></div>
    <small class="muted">5% do salário mínimo (${brl(SAL_MIN[ano]||0)}) + ICMS/ISS. Vence todo dia 20 do mês seguinte. Atrasou: multa de 0,33% ao dia (até 20%) mais juros.</small>
    ${atual.length?`<div class="note warn" style="margin-top:10px">${atual.map(k=>{const s=stDAS(k);return`Guia de <b>${MES[+k.slice(5)-1]}</b> ${s.k==='vencida'?'<b class="up">vencida</b>':'vence'} em ${fmtData(isoD(venceDAS(k)))}`}).join('<br>')}</div>`:''}
    <a class="btn primary block" style="margin-top:10px" data-act="fxPgmei" href="${LINKS_FISCAIS[0][2]}" target="_blank" rel="noopener">Gerar guia no PGMEI (copia o CNPJ)</a>
    <div class="list" style="margin-top:10px">${comps.map(k=>{const s=stDAS(k),d=(f.das||{})[k];return`<div class="item static"><div class="main"><div class="t">${MES[+k.slice(5)-1].charAt(0).toUpperCase()+MES[+k.slice(5)-1].slice(1)}</div><div class="s">vence ${fmtData(isoD(venceDAS(k)))}${d&&d.st==='pago'?` · paga em ${fmtData(d.data)} · ${brl(d.valor)}`:''}</div></div><div class="end" style="gap:6px;display:flex;align-items:center">${s.k==='na'?'':`<span class="chip ${s.k==='pago'?'s-pronto':s.k==='aberta'?'s-conf':'s-orc'}" style="${s.k==='vencida'?'color:var(--bad)':''}">${s.t}</span>`}${s.k==='pago'?`<button class="btn ghost" data-dasdesf="${k}" style="min-height:32px">Desfazer</button>`:s.k==='futuro'||(s.k==='na'&&s.t==='Antes do CNPJ')?'':`<button class="btn${s.k==='na'?' ghost':''}" data-daspaguei="${k}" style="min-height:32px">Paguei</button>`}</div></div>`}).join('')}</div>
    <small class="muted">Ao marcar “Paguei”, a guia entra nas despesas do Financeiro.</small>
  </div>
  <div class="section"><h2>Faturamento de ${ano}</h2>
    <div class="row between"><span>Recebido no ano</span><b>${brl(fat)}</b></div>
    <div class="bar" style="margin:8px 0"><i style="animation:none;width:${Math.max(2,pct)}%;${pct>=80?'background:var(--warn)':''}"></i></div>
    <small class="muted">${fmt(pct,0)}% do limite do MEI (${brl(LIMITE_MEI)} por ano). Conta o que foi registrado como entrada no Financeiro.</small>
    ${pct>=80?`<div class="note warn" style="margin-top:8px">Perto do limite do MEI. Converse com um contador antes de passar de ${brl(LIMITE_MEI)}.</div>`:''}
  </div>
  <div class="section"><h2>Declaração anual (DASN-SIMEI ${anoAnt})</h2>
    <div class="row between"><span>Faturamento de ${anoAnt}</span><b>${brl(fatAnt)}</b></div>
    <small class="muted">Entregue até 31 de maio de ${ano}. Para confeitaria, o valor vai em “Receita com comércio e indústria”.</small>
    <div class="grid2" style="margin-top:8px"><a class="btn" href="${LINKS_FISCAIS[1][2]}" target="_blank" rel="noopener">Fazer a declaração</a>${dasn&&dasn.st==='entregue'?`<button class="btn ghost" data-act="fxDasnDesf">✓ Entregue em ${esc(fmtData(dasn.data))}</button>`:'<button class="btn primary" data-act="fxDasn">Já entreguei</button>'}</div>
  </div>
  <div class="section"><h2>Sites da Receita</h2><div class="list">${LINKS_FISCAIS.map(([t,s,u])=>`<a class="item" href="${u}" target="_blank" rel="noopener" data-fxlink><div class="main"><div class="t">${esc(t)}</div><div class="s">${esc(s)}</div></div><div class="end">›</div></a>`).join('')}</div>
    <small class="muted">Ao abrir um site, o CNPJ já fica copiado para colar.</small></div>`;
}
async function consultarCnpj(){
  const el=document.getElementById('fxCnpj');const d=String(el&&el.value||'').replace(/\D/g,'');

const FORMAS_PG={pix:'Pix',credito:'Cartão de crédito',debito:'Cartão de débito',dinheiro:'Dinheiro',transferencia:'Transferência'};
const TIPOS_PG={sinal:'Sinal',restante:'Restante',total:'Valor total'};
const pagamentosDe=p=>Array.isArray(p&&p.pagamentos)?p.pagamentos:[];

const totalPago=p=>{const l=pagamentosDe(p);return l.length?Math.round(l.reduce((s,x)=>s+num(x.valor),0)*100)/100:num(p.sinal)};
function extenso(v){
  const u=['zero','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','catorze','quinze','dezesseis','dezessete','dezoito','dezenove'];
  const d=['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
  const c=['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
  const ate999=n=>{if(n===100)return'cem';const p=[];const h=Math.floor(n/100),r=n%100;if(h)p.push(c[h]);if(r){if(r<20)p.push(u[r]);else{const dz=Math.floor(r/10),un=r%10;p.push(d[dz]+(un?' e '+u[un]:''))}}return p.join(' e ')};
  const inteiro=n=>{if(!n)return'zero';const mil=Math.floor(n/1000),r=n%1000;const p=[];if(mil)p.push(mil===1?'mil':ate999(mil)+' mil');if(r)p.push(ate999(r));return p.join(r&&(r<100||r%100===0)?' e ':' ')};
  v=Math.round(num(v)*100);const re=Math.floor(v/100),ce=v%100;const p=[];
  if(re)p.push(`${inteiro(re)} ${re===1?'real':'reais'}`);
  if(ce)p.push(`${ate999(ce)} ${ce===1?'centavo':'centavos'}`);
  return p.join(' e ')||'zero real';
}
const nRecibo=n=>String(n||0).padStart(4,'0');
const cidadeCfg=()=>{const e=String(S.cfg.endereco||'').split(',').map(x=>x.trim()).filter(Boolean);return e.length>1?e[e.length-1].replace(/\s*-\s*[A-Z]{2}$/,''):''};
function viaPg(pg){return pg.forma==='credito'?`cartão de crédito${num(pg.parcelas)>1?` em ${num(pg.parcelas)}x`:''}`:pg.forma==='debito'?'cartão de débito':pg.forma==='pix'?'Pix':(FORMAS_PG[pg.forma]||'').toLowerCase()}
function referentePg(p,pg){
  const b=p.bolo||{};const bolo=b.tamanho?(/^bol/i.test(b.tamanho)?`do ${b.tamanho}`:`do bolo ${b.tamanho}`):'do bolo';
  const d=parseD(p.entrega);const data=d?` para ${WDL[d.getDay()]}, ${pad(d.getDate())}/${pad(d.getMonth()+1)}`:'';
  const pct=num(p.valor)?Math.round(num(pg.valor)/num(p.valor)*100):0;
  if(pg.tipo==='sinal')return`ao sinal${pct&&pct<100?` (${pct}%)`:''} do pedido ${bolo}${data}`;

}

// acha o item já cadastrado: pelo código da loja (com a mesma primeira palavra), pela descrição da nota ou pelo nome
function acharCadastro(it,meta){
  const ents=Object.entries(S.ing),d=normDesc(it.descricao),w=d.split(' ')[0];
  if(it.cod){const lojaK=chaveCod(meta,it.cod);
    const e=ents.find(([,g])=>(g.cods||[]).some(c=>c===lojaK||(c.split(':')[1]===it.cod&&normDesc(g.descNota||g.nome).split(' ')[0]===w)));if(e)return e[0]}
  let e=ents.find(([,g])=>g.descNota&&normDesc(g.descNota)===d);if(e)return e[0];
  e=ents.find(([,g])=>normDesc(g.nome)===normDesc(it.nome));return e?e[0]:'';
}

async function salvarRevisao(rev,meta,btn){
  const sel=rev.filter(r=>r.on);
  const bad=sel.filter(r=>!(r.preco>0&&r.qtd>0));
  if(bad.length){toast('Preencha o preço e a quantidade dos itens marcados.');return}
  btn.disabled=true;btn.textContent='Salvando…';
  const antes={...S.ing};const out=[];
  for(const r of sel){
    const c=comparar(r);
    const entry={data:meta.data,preco:r.preco,qtd:r.qtd,unidade:r.unidade,loja:meta.loja||null};
    const ck=chaveCod(meta,r.cod);
    const g=r.ingId&&S.ing[r.ingId];
    if(g){const hist=histBase(g);hist.push(entry);const cods=[...new Set([...(g.cods||[]),...(ck?[ck]:[])])].slice(-10);
      await save('ing',r.ingId,{...g,preco:r.preco,qtd:r.qtd,unidade:r.unidade,historico:hist.slice(-12),atualizado:meta.data,cods,descNota:r.desc||g.descNota||null,exemplo:false});out.push({nome:g.nome,c})}
    else{const nome=(r.nome||r.desc).trim()||(r.cat==='embalagem'?'Embalagem':'Ingrediente');
      await save('ing',null,{nome,preco:r.preco,qtd:r.qtd,unidade:r.unidade,historico:[entry],atualizado:meta.data,cat:r.cat==='embalagem'?'embalagem':'ingrediente',cods:ck?[ck]:[],descNota:r.desc||null});
      out.push({nome,c:{k:'muted',t:r.cat==='embalagem'?'Nova embalagem':'Novo ingrediente',novo:true}})}
  }
  if(S.db){try{await S.db.collection('compras').add({data:meta.data,loja:meta.loja||null,total:meta.total||null,itens:sel.map(r=>({nome:(r.ingId&&antes[r.ingId]?antes[r.ingId].nome:r.nome),cod:r.cod||null,cat:r.cat,preco:r.preco,qtd:r.qtd,unidade:r.unidade,pacotes:r.pacotes})),criado:new Date().toISOString()})}catch(e){}}
  closeSheet();openResultado(out,antes);
}

function formCard(id){

    const removed=((id&&S.card[id]&&S.card[id].fotos)||[]).filter(x=>!obj.fotos.includes(x));
    save('card',id,obj);closeSheet();toast('Bolo salvo');
    const livres=removed.filter(f=>!fotoNaGaleriaOuPedido(f));if(livres.length){const a=await getAssets();if(a)livres.forEach(fid=>a.delete(fid).catch(()=>{}))}
  });
}

const IMG={bg:'#FFFFFF',pink:'#FEE4E5',soft:'#FBD0D7',brand:'#A2708B',accent:'#8A5674',ink:'#3A2431',muted:'#7D6175'};
async function fontsReady(){try{await Promise.all(['700 48px "Josefin Sans"','90px "Allura"','500 30px "Figtree"','700 30px "Figtree"'].map(f=>document.fonts.load(f)))}catch(e){}}
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src})}
async function loadAsset(id){try{const r=await fetch(blobUrl(id));if(!r.ok)return null;const b=await r.blob();try{return await createImageBitmap(b)}catch(e){return await loadImg(URL.createObjectURL(b))}}catch(e){return null}}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function cover(ctx,img,x,y,w,h,r){ctx.save();rr(ctx,x,y,w,h,r);ctx.clip();if(img){const iw=img.width,ih=img.height,s=Math.max(w/iw,h/ih);ctx.drawImage(img,x+(w-iw*s)/2,y+(h-ih*s)/2,iw*s,ih*s)}else{ctx.fillStyle=IMG.soft;ctx.fillRect(x,y,w,h)}ctx.restore()}
function lines(ctx,t,maxW,max){const ws=String(t||'').split(/\s+/).filter(Boolean),out=[];let cur='';for(const w of ws){const n=cur?cur+' '+w:w;if(ctx.measureText(n).width>maxW&&cur){out.push(cur);cur=w}else cur=n}if(cur)out.push(cur);if(out.length>max){out.length=max;out[max-1]=out[max-1].replace(/\s*\S*$/,'')+'…'}return out}
function spaced(ctx,t,x,y,sp){if('letterSpacing' in ctx){ctx.letterSpacing=sp+'px';ctx.fillText(t,x,y);ctx.letterSpacing='0px';return}ctx.fillText(t.split('').join(' '),x,y)}
async function drawMarca(ctx,cx,y,size){
  const logo=await loadImg(LOGO).catch(()=>null);
  if(logo){ctx.save();ctx.beginPath();ctx.arc(cx,y+size/2,size/2,0,Math.PI*2);ctx.clip();ctx.drawImage(logo,cx-size/2,y,size,size);ctx.restore()}
}
function rodape(ctx,W,y){
  const c=S.cfg;const parts=[c.whatsapp?`Encomendas: ${c.whatsapp}`:'',c.instagram||''].filter(Boolean);
  if(!parts.length)return;
  ctx.fillStyle=IMG.accent;ctx.font='700 30px "Figtree", sans-serif';ctx.textAlign='center';ctx.fillText(parts.join('   ·   '),W/2,y);ctx.textAlign='left';

      if(zap){ctx.fillStyle='#25D366';rr(ctx,P,y,W-2*P,96,48);ctx.fill();ctx.fillStyle='#FFFFFF';ctx.font='800 36px "Figtree", sans-serif';ctx.textAlign='center';ctx.fillText('Fazer meu pedido no WhatsApp ›',W/2,y+61);ctx.textAlign='left';links.push({x:P,y,w:W-2*P,h:96,url:zap});y+=126}
      const rows=[insta&&['Veja nossos bolos no Instagram',c.instagram,insta],aval&&['Veja nossas avaliações','O que nossos clientes dizem',aval],maps&&['Ver rota até a retirada',c.endereco,maps]].filter(Boolean);
      if(rows.length){const h=rows.length*104+20;ctx.fillStyle=IMG.pink;rr(ctx,P,y,W-2*P,h,28);ctx.fill();let ry=y+10;
        rows.forEach(([l1,l2,u],i)=>{if(i){ctx.fillStyle=IMG.soft;ctx.fillRect(P+36,ry,W-2*P-72,2)}ctx.fillStyle=IMG.ink;ctx.font='700 32px "Figtree", sans-serif';ctx.fillText(l1,P+36,ry+46);ctx.fillStyle=IMG.accent;ctx.font='600 27px "Figtree", sans-serif';ctx.fillText(lines(ctx,l2,W-2*P-140,1)[0],P+36,ry+84);
          ctx.font='700 44px "Figtree", sans-serif';ctx.textAlign='right';ctx.fillText('›',W-P-36,ry+66);ctx.textAlign='left';links.push({x:P,y:ry,w:W-2*P,h:104,url:u});ry+=104});y+=h+40}
    }
    ctx.fillStyle=IMG.pink;ctx.fillRect(0,y,W,rod.length?150:60);
    if(rod.length){ctx.textAlign='center';ctx.fillStyle=IMG.accent;ctx.font='700 34px "Figtree", sans-serif';ctx.fillText(rod.join('   ·   '),W/2,y+70);if(c.endereco){ctx.fillStyle=IMG.muted;ctx.font='500 26px "Figtree", sans-serif';ctx.fillText(`Retirada: ${c.endereco}`,W/2,y+112)}ctx.textAlign='left';y+=150}else y+=60;
    return y;
  };
  const t=document.createElement('canvas');t.width=W;t.height=10;const H=desenhar(t.getContext('2d'));
  const cv=document.createElement('canvas');cv.width=W;cv.height=Math.min(H,16000);desenhar(cv.getContext('2d'));
  return{cv,links:links.slice()};
}
async function imagemBolo(id){
  const it=S.card[id];if(!it)return;
  toast('Montando a imagem…');
  await fontsReady();
  const foto=(it.fotos||[])[0]?await loadAsset(it.fotos[0]):null;
  const W=1080,H=1350,P=60;
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const ctx=cv.getContext('2d');
  ctx.fillStyle=IMG.pink;ctx.fillRect(0,0,W,H);
  cover(ctx,foto,0,0,W,860,0);
  await drawMarca(ctx,W-P-80,780,160);
  ctx.fillStyle=IMG.brand;ctx.font='700 28px "Josefin Sans", sans-serif';if(it.categoria)spaced(ctx,it.categoria.toUpperCase(),P,920,3);
  ctx.fillStyle=IMG.ink;ctx.font='700 56px "Figtree", sans-serif';
  const nl=lines(ctx,it.nome,W-2*P-200,2);nl.forEach((l,j)=>ctx.fillText(l,P,990+j*64));
  let y=990+nl.length*64+6;
  ctx.fillStyle=IMG.muted;ctx.font='500 32px "Figtree", sans-serif';
  const desc=[it.descricao,composicao(it)].filter(Boolean).join(' · ');
  lines(ctx,desc,W-2*P,3).forEach((l,j)=>ctx.fillText(l,P,y+j*42));
  const tm=S.comp[it.tamanhoId];
  if(tm){ctx.fillStyle=IMG.accent;ctx.font='700 54px "Figtree", sans-serif';ctx.fillText(precoTam(tm),P,H-120);ctx.fillStyle=IMG.muted;ctx.font='500 30px "Figtree", sans-serif';ctx.fillText(`${tm.nome}${tm.fatias?` · rende ${fmt(tm.fatias)} fatias`:''}`,P,H-75)}
  ctx.textAlign='right';ctx.fillStyle=IMG.accent;ctx.font='700 28px "Figtree", sans-serif';
  const c=S.cfg;if(c.whatsapp)ctx.fillText(c.whatsapp,W-P,H-120);if(c.instagram)ctx.fillText(c.instagram,W-P,H-75);ctx.textAlign='left';
  imagemPronta(cv,`bolo-${(it.nome||'cardapio').toLowerCase().normalize('NFD').replace(/[^\w\s-]/g,'').trim().replace(/\s+/g,'-').slice(0,40)||'cardapio'}.jpg`);
}
async function imagemPronta(cv,filename){
  const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',.92));
  if(!blob){toast('Não consegui montar a imagem neste aparelho.');return}
  const url=URL.createObjectURL(blob);
  const dl=await getDownloads();
  const sh=openSheet('Imagem pronta',`<div class="stack"><img src="${url}" alt="Prévia da imagem" style="border-radius:12px;border:1px solid var(--line);width:100%">
    ${dl?'<button class="btn primary" type="button" data-save>Salvar imagem</button>':''}
    <p class="muted" style="margin:0">${dl?'Depois de salvar, mande pelo WhatsApp ou poste no Instagram.':'Toque e segure a imagem para salvar no celular.'}</p></div>`,2);
  const b=sh.querySelector('[data-save]');
  if(b)b.addEventListener('click',()=>{dl.save({filename,data:blob}).then(()=>toast('Imagem salva'),e=>{if(!(e&&e.code==='declined'))toast('Não consegui salvar. Toque e segure a imagem.')})});
}

async function restaurarBackup(file){
  let j;try{j=JSON.parse(await file.text())}catch(er){toast('Esse arquivo não é um backup do app.');return}
  const m={ingredientes:j.ingredientes||{},componentes:j.componentes||j.massasRecheiosCoberturas||{},cardapio:j.cardapio||{},galeria:j.galeria||{},lancamentos:j.lancamentos||{},compras:j.compras||{},receitas:j.receitas||{},pedidos:j.pedidos||{},config:j.config||(j.ajustes?{geral:j.ajustes}:{})};
  const n=Object.keys(m.pedidos).length,ni=Object.keys(m.ingredientes).length,nc=Object.keys(m.componentes).length;
  if(!n&&!ni&&!nc&&!Object.keys(m.cardapio).length){toast('Esse backup está vazio.');return}
  const sh=openSheet('Restaurar backup',`<div class="stack"><p style="margin:0">Este backup tem <b>${n} pedidos</b>, <b>${ni} ingredientes</b>, <b>${nc} massas, recheios, coberturas, tamanhos e toppers</b>, ${Object.keys(m.cardapio).length} bolos no cardápio e ${Object.keys(m.receitas).length} receitas.</p><p class="muted" style="margin:0">O que tiver o mesmo item no app será trocado pelo do backup. O resto fica como está.</p><button class="btn primary" type="button" data-ok>Restaurar</button></div>`);
  sh.querySelector('[data-ok]').addEventListener('click',async ev=>{ev.target.disabled=true;ev.target.textContent='Restaurando…';
    try{
      if(S.db&&S.db.importar)await S.db.importar(m);
      else{const k={ingredientes:'ing',componentes:'comp',cardapio:'card',galeria:'gal',lancamentos:'lan',compras:'compr',receitas:'rec',pedidos:'ped'};Object.entries(k).forEach(([c,kk])=>{S[kk]={...S[kk],...m[c]}});if(m.config.geral)S.cfg={...DEFAULT_CFG,...m.config.geral};saveLocal();render()}
      closeSheet();toast('Backup restaurado');
    }catch(er){ev.target.disabled=false;ev.target.textContent='Restaurar';toast('Não consegui restaurar. Confira a internet e tente de novo.')}});
}
